# Per-device configuration. One file per Jetson.
# Required fields: site_id, device_id, excluded_rooms.
# The device refuses to start if any required field is missing or empty.

site_id: "REPLACE_ME"          # one of: urban_large, urban_small, regional_large, regional_small
device_id: "REPLACE_ME"        # short stable id, e.g. "jetson-ul-01"

# Rooms in which vision/audio modalities MUST remain disabled.
# Use the centre's room ids; environmental sensors stay enabled.
excluded_rooms:
  - "example-room-id"

# Confidence threshold below which event records are discarded.
event_confidence_floor: 0.6

# Per-minute aggregate bin size, in seconds.
aggregate_bin_seconds: 60

# Local encrypted log retention, in days.
local_retention_days: 14

# Uplink batch interval, in seconds. Store-and-forward if link is down.
uplink_interval_seconds: 300

# Allow-list of fields permitted to leave the inference pipeline.
# The privacy filter drops any field not in this list.
allowed_event_fields:
  - timestamp_wall
  - timestamp_monotonic
  - site_id
  - device_id
  - room_id
  - event_type
  - confidence
  - aggregate_bin

# Field patterns that are explicitly forbidden, even if accidentally
# added to allowed_event_fields. The self-test fails if any of these
# appear anywhere in the allow-list.
forbidden_field_patterns:
  - "frame"
  - "image"
  - "pcm"
  - "audio_raw"
  - "spectrogram"
  - "embedding"
  - "face"
  - "name"
